schema_version: 1
id: minimax-m3.1-flash
display_name: MiniMax-M3.1-Flash (428B MoE, MiniMax)
description: MiniMax-M3.1-Flash — a 428B MoE (23B active a token; 128 routed experts top-4 + 1 shared, 3 leading dense layers) with GQA attention and a block-sparse attention indexer in every layer, 1M native context; served on one or two 3090s by Project Maya's maya-mm3 engine from Maya's own GGUF quant, the experts VRAM doesn't hold computed on the CPU from RAM.
family: minimax-m3-moe
# Arch: MiniMaxM3SparseForCausalLM (the text model of MiniMaxM3SparseForConditionalGeneration, model_type
# minimax_m3_vl). Values from MiniMaxAI/MiniMax-M3.1-Flash's config.json text_config (@262ae683, read 2026-10-27).
# ⚠️ LICENSE: the MiniMax Community License (LICENSE in the weights' repo, LICENSE.minimax-m31 in Maya's): free for
# non-commercial use, commercial use has conditions.
hidden_size: 6144                # hidden_size
num_hidden_layers: 60            # num_hidden_layers (moe_layer_freq: layers 0-2 dense, 3-59 MoE)
intermediate_size: 12288         # dense_intermediate_size (the 3 dense layers)
num_attn_heads: 64               # num_attention_heads
num_kv_heads: 4                  # num_key_value_heads (GQA)
head_dim_attn: 128               # head_dim
attention_k_eq_v: true           # one head_dim (128) for K and V
max_ctx_supported: 1048576       # max_position_embeddings — we SHIP 204800 (Maya has run 256K end to end)
num_experts: 128                 # num_local_experts
num_experts_per_tok: 4           # num_experts_per_tok
moe_intermediate_size: 3072      # intermediate_size (each routed expert)
shared_expert_intermediate_size: 3072   # shared_intermediate_size (n_shared_experts = 1)
vision_capable: false            # the model has a vision tower, but the slugs don't fetch it (--vision off)
default_weight_variant: maya-s
valid_tp: [1, 2]                 # the registry's tp counts GPUs: one card, or two in a layer split (maya-mm3's
                                 # tensor parallel is its EXL3 path's, not a GGUF pack's)
compatible_drafters: [maya-mm3-dspark]
# kv-calc has no model for a block-sparse indexer over streamed K / V: every slug sets kvcalc_key="SKIP", as the
# other Maya slugs.
kv_calc_supported: false
requires_genesis: false

weights:
  maya-s:
    path: minimax-m3.1-flash-maya-gguf/Maya-S
    # local_subdir is the BUCKET; `files:`/`verify_glob` carry the quant-folder prefix (the HF repo keeps one folder
    # per quant), the same shape as glm-5.3-flash's Maya quants
    local_subdir: minimax-m3.1-flash-maya-gguf
    size_gb: 122.46
    format: gguf
    status: incubating
    hf_repo: peasantsmith/MiniMax-M3.1-Flash-Maya-GGUF
    revision: 4b40cc791e2cdf59c63822efcf097f59e46ed59b
    shards: 3
    files:
      - Maya-S/MiniMax-M3.1-Flash-Maya-S-IQ2_XXS-00001-of-00003.gguf
      - Maya-S/MiniMax-M3.1-Flash-Maya-S-IQ2_XXS-00002-of-00003.gguf
      - Maya-S/MiniMax-M3.1-Flash-Maya-S-IQ2_XXS-00003-of-00003.gguf
      - Maya-S/MiniMax-M3.1-Flash-Maya-S-maya-indexers.gguf
    verify_glob: "Maya-S/*.gguf"
    manual_note: "🐣 Project Maya's own quant of MiniMax-M3.1-Flash (peasantsmith): routed experts IQ2_XXS, the most sensitive IQ2_XS / IQ2_S / IQ3_XXS (~2.1 bits), attention and indexers Q8_0, the rest Q6_K. The dense layers 0-2's sparse-attention indexers sit in a side file, MiniMax-M3.1-Flash-Maya-S-maya-indexers.gguf, beside the 3 shards: Maya's pack reads both (stock llama.cpp loads the shards alone). Served by the strata-maya engine's maya-mm3 (Project Maya v1.1.29 on). The launcher SHA-256-checks the files against Maya's own manifest (tools/mm3/download_gguf.json) once, then builds Maya's pack on the data volume. Text only. ⚠️ MiniMax Community License: free for non-commercial use, commercial use has conditions."
  maya-mm3-dspark:
    path: minimax-m3.1-flash-maya-gguf/dspark
    # local_subdir is the BUCKET: Maya's GGUF repo keeps the drafter in its dspark/ folder, which --local-dir
    # preserves, so files and the glob carry the dspark/ prefix
    local_subdir: minimax-m3.1-flash-maya-gguf
    size_gb: 2.32
    format: safetensors
    status: incubating
    hf_repo: peasantsmith/MiniMax-M3.1-Flash-Maya-GGUF
    revision: 4b40cc791e2cdf59c63822efcf097f59e46ed59b
    kind: draft
    files:
      - dspark/added_tokens.json
      - dspark/chat_template.jinja
      - dspark/config.json
      - dspark/merges.txt
      - dspark/model-dspark-00001.safetensors
      - dspark/model.safetensors.index.json
      - dspark/special_tokens_map.json
      - dspark/tokenizer.json
      - dspark/tokenizer_config.json
      - dspark/vocab.json
    verify_glob: "dspark/*"
    manual_note: "MiniMax-M3.1-Flash's DSpark drafter, as Maya's setup takes it from Mia-AiLab's EXL3 repo (tools/mm3/download.json, @fe796c40): Maya's GGUF repo carries the same files (every one hashed equal 2026-10-27), so the slugs fetch it from there with the quant. Maya's tools/mm3/pack_gguf.py indexes it through --companions. On in both slugs (DSPARK=off turns it off): Maya's own speed calibration kept it on both (v1.1.31: +20.5% sustained decode on two 3090s, +8.2% on one)."
