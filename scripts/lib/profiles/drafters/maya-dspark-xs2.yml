# peasantsmith's dspark/dspark-xs2 (.bin + .json, drafter_pack.py's format): DeepSeek's DSpark drafter (3 blocks,
# layers 40-42, 128 experts top-3) with experts in IQ2_XXS (3.50 GB), dense Q8_0 (0.60 GB) + BF16 (0.14 GB). Maya's
# tools/ds4/pack_gguf.py takes it with --drafter; it does not read unsloth's dspark GGUF (the llama.cpp `dspark`
# drafter). Engaged by maya-ds4's `--dspark on` (Maya's own setup writes `--dspark none` until its calibration
# says drafting pays, so the launcher passes `on` explicitly).
#
# n is the draft block length, which comes from the pack's geometry (ds4.txt dspark_block_size), not from a flag:
# maya-ds4 has no depth setting, so n_default = n_max = 5 (DeepSeek-V4.1-Flash's own). ⚠️ ISTA's GGUF carries no
# DSpark geometry. Maya v1.1.27-v1.1.29's pack builder then wrote 0, so the drafter loaded and never drafted,
# silently, unless the launcher wrote the values in; v1.1.30's pack builder fills in DeepSeek-V4.1-Flash's own
# (docs/UPSTREAM.md).
#
# MEASURED 2026-10-24/25 on two 3090s (hand-run local test images, ISTA IQ2_XXS): 83-84% of drafts kept; with
# tensor parallel, code decode ~40 -> ~51 tok/s (+20-32%), narrative +1-6%, prefill -5-7%. Its VRAM comes out of
# the expert pool (~4.7 GB with its 384 experts), on the GPU that holds layers 40-42.
requires_engine_min: null
