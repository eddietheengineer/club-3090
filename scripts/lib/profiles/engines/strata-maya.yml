type: strata
stability: experimental
min_sm: 7.5
lineage:
  relation: "fork"
  base: "strata"
  base_version: null
  source: "https://github.com/mw00/project-maya"
  source_ref: "8621e33159f426da2d376be4ec012b0ce8fe2948"
  chain: []
  delta: "Strata's C++/CUDA engine and Python server rewritten for GLM-5.3-Flash only (the GLM5-Next runner, a per-layer VRAM expert pool, a pinned RAM tier and a CPU lane priced against PCIe, MTP drafting across a two-card split), with its own quants (peasantsmith/GLM-5.3-Flash-Maya-GGUF); and a second engine, maya-ds4, for DeepSeek-V4.1-Flash-1017 (src/ds4: tensor parallel or a layer split, every CPU-side expert copied into RAM when it fits, a DSpark drafter, Engram tables). Upstream publishes no image, Dockerfile or Linux engine; our image compiles each release with our own Dockerfile (upstream's STRATA_PORTABLE option for an AVX2 baseline, text only), an image-provenance exception (docs/ADDING_ENGINES.md)"
image_env: STRATA_MAYA_IMAGE
install:
  method: docker_image
  # Built and pushed from the rig with models/glm-5.3-flash/strata-maya/image/ (text only); upstream, recipe and
  # archs are the image's own labels. scripts/strata-pin-bump.sh writes the two pin- lines (the first earlier pin
