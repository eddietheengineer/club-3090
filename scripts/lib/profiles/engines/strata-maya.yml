supported_model_families:
  - glm5next-moe          # GLM-5.3-Flash: the `maya` engine
  - deepseek41-moe        # DeepSeek-V4.1-Flash-1017: the `maya-ds4` engine (the image builds both since #1801)
supported_weight_formats:
  - gguf                  # Project Maya's own quants (Maya-S / Maya-M / Maya-L); ISTA's GSQ-RCO GGUF of DeepSeek-V4.1-Flash
  - maya-dspark           # Maya's DSpark drafter format (drafter_pack.py's .bin + .json), read by tools/ds4/pack_gguf.py
supported_kv_formats:
  - fp16                  # the engine's latent KV cache, as its /metrics reports it ("kv": "fp16")
supported_drafters:
  - dspark                # DeepSeek-V4.1-Flash's DSpark drafter (maya-ds4 --dspark on). GLM's MTP is the model's own
                          # NextN block (two or more GPUs), not a club drafter
notes: >
  Project Maya (github.com/mw00/project-maya, MIT): a fork of Strata (Niko1221/Strata) for
  GLM-5.3-Flash, with its own quants, and DeepSeek-V4.1-Flash-1017 on a second engine (maya-ds4). Upstream publishes no Linux image, Dockerfile or
  engine (maya.sh compiles on the user's PC), so club-3090 builds one per release
  (models/glm-5.3-flash/strata-maya/image/, an image-provenance exception in
  docs/ADDING_ENGINES.md): both engines (maya, maya-ds4) compiled as maya.py compiles them, ggml's
  CPU code on an AVX2 baseline, archs 75;80;86;89;120, text only (no vision encoder or DeepSeek
  vision tower, no DFlash2 drafter). Host
  needs NVIDIA driver >= 580 (CUDA 13) and an AVX2 CPU; x86-64 only. Experts are spread over a
  per-layer VRAM pool, a pinned RAM tier sized from free memory, and the GGUF files; the CPU
  computes part of each token's RAM-tier experts. GLM's MTP drafting runs only on two or more
  GPUs; DeepSeek drafts with a separate DSpark drafter (maya-dspark-xs2).
  Serves on 8080 with Strata's /health, /props, /slots and JSON /metrics shape (engine kind
  `strata`); the per-request engine lines go to a log file on the data volume.
