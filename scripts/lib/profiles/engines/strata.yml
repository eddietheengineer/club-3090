schema_version: 1
id: strata
display_name: Strata (club-3090's portable image of the upstream release)
type: strata
stability: experimental
min_sm: 7.5
lineage:
  relation: "new"
  base: null
  base_version: null
  source: "https://github.com/Niko1221/Strata"
  source_ref: "296b59d2f73c8f04a805df29c2fa97655adace78"
  chain: []
  delta: "Independent C++/CUDA engine for Qwen3.8-Flash-Next with its own Python server; uses ggml's CPU backend and llama.cpp's mtmd/gguf-py as libraries. Our image builds upstream's Dockerfile at the release commit with ggml's CPU code on an AVX2 baseline (STRATA_PORTABLE=ON), an image-provenance exception (docs/ADDING_ENGINES.md)"
image_env: STRATA_IMAGE
install:
  method: docker_image
  # v0.1.44.1 (upstream 296b59d2), CI run 38508265456: archs 75;80;86;89;120 + the image encoder.
  # Pinned 2026-10-14; the v0.1.43.1 pin it replaced (7f8643c8, 2026-10-13) also carried sm_90.
  spec: ghcr.io/noonghunna/strata-club3090@sha256:fb97d83bdae01034102c4983273b68766eb057efac961273cf243300dc6afa1c
supported_model_families:
  - qwen4exp              # Qwen3.8-Flash-Next family: Strata is written for this model only
supported_weight_formats:
  - gguf                  # ISTA-DASLab GSQ-RCO i-quants (+ Unsloth UD-Q4_K_XL, experimental)
supported_kv_formats:
  - q8_0                  # nearest catalog token for Strata's int8 KV (--kv int8), MEASURED 2026-10-06
supported_drafters: []    # MTP is Strata's built-in draft layer (--spec), not a club drafter
notes: >
  Strata (github.com/Niko1221/Strata, MIT): its own C++/CUDA engine for Qwen3.8-Flash-Next plus a
  Python server (setup.py), not a llama.cpp fork; it uses ggml's CPU backend and llama.cpp's
  mtmd / gguf-py as libraries. Upstream publishes no Linux image or engine, so club-3090 builds
  one per release (models/qwen3.8-flash-next/strata/image/, an image-provenance exception in
  docs/ADDING_ENGINES.md): upstream's Dockerfile at the release commit, ggml's CPU code on an
  AVX2 baseline, archs 75;80;86;89;120 + the image encoder. Host needs NVIDIA driver >= 580
  (CUDA 13) and an AVX2 CPU; x86-64 only (no DGX Spark). Serves on 8080 and answers /props like
  llama-server; its runtime numbers come from GET /metrics (scripts/lib/strata_metrics.py), as
  its per-request log lines stay in a file inside the container. Engine kind `strata` (#1672).
