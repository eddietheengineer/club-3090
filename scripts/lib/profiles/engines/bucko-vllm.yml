schema_version: 1
id: bucko-vllm
display_name: bucko-vllm (DominikBucko's Qwen3.8-Flash-Next 2x3090 runtime, v0.5.0)
type: vllm
# #1365: the compose env var this engine's image is injected as.
image_env: BUCKO_IMAGE
stability: experimental
min_sm: 8.6
lineage:
  relation: derivative
  base: vllm
  base_version: "0.1.dev20073+g8e685d198"
  source: https://github.com/DominikBucko/qwen38-flash-next-2x3090
  source_ref: e7279ab7ff46cafe118090887db9e4553ca9ca1b
  chain: []
  delta: "~48 vLLM files replaced on vLLM's day-0 qwen38-flash-next image (vllm/vllm-openai:qwen38-flash-next@sha256:fc120ece...): PLE offload, a static-hot + LRU expert cache in the WNA16 MoE method, humming MoE kernels, MTP3 with hybrid-state rollback"
install:
  method: docker_image
  # DominikBucko's official CI-built GHCR release image (build-provenance attested), v0.5.0,
  # pinned by digest. Its OCI labels: source DominikBucko/qwen38-flash-next-2x3090, revision
  # e7279ab7 (= tag v0.5.0), base vllm/vllm-openai:qwen38-flash-next@sha256:fc120ece...
  # The pin's record: pin-current is what spec pins now; pin-earlier lists earlier pins, newest first (the first
  # is the rollback). docs/UPSTREAM.md's Pinned images table holds why it's pinned, not these.
  # pin-current: v0.5.0 · revision e7279ab7 · base vllm/vllm-openai:qwen38-flash-next@sha256:fc120ece… · pinned 2026-10-13
  spec: ghcr.io/dominikbucko/qwen38-flash-next-2x3090@sha256:75adfc64ba1576b8a677f455d54891c152444e4bf43fbc37cb8f1885a8db3387
supported_model_families:
  - qwen4exp              # Qwen3.8-Flash-Next family (bucko is written for this model only)
supported_weight_formats:
  - autoround             # albucino W4A16 AutoRound (+ FP8 PLE); Swift-1.5 W4A16 AutoRound
supported_kv_formats:
  - bf16                  # read from the running engine (kv_cache_dtype=auto on a bf16 model), 2026-09-18
supported_drafters: []    # MTP3 is bucko's built-in compact draft, not a club drafter
notes: >
  DominikBucko's runtime for Qwen3.8-Flash-Next on 2x RTX 3090 (Apache-2.0): a vLLM derivative,
  kept a separate engine and never folded into vllm-stable. Its speed is its own expert cache
  (static hot set + dynamic LRU) plus MTP3 with hybrid-state rollback; stock vLLM v0.31.0 with
  the same offload flags ran Swift-1.5 at 16.2 tok/s against bucko's ~80. Bump by moving the
  digest to a newer bucko release. Capabilities are EVIDENCED, not assumed: widen
  supported_kv_formats / supported_drafters only once measured.
