schema_version: 1
id: qengine
display_name: QEngine (bpx03's engine for Qwen3.8-27B INT4 on RTX 3090s; the author's own image)
type: qengine
stability: experimental
min_sm: 8.6
lineage:
  relation: "new"
  base: null
  base_version: null
  source: "https://github.com/bpx03/QEngine"
  source_ref: "116bd8d978243f782e8d21d1d63d155bf89c3839"
  chain: []
  delta: "Independent C++/CUDA engine (libqengine.so, about 26k lines) for one model, Qwen3.8-27B INT4 (RedHatAI's compressed-tensors W4A16 checkpoint and its MTP head), tuned for RTX 3090s with tensor parallel over PCIe, with its own Python server (OpenAI- and Anthropic-compatible APIs). Pinned to the image its author publishes (ghcr.io/bpx03/qengine)"
image_env: QENGINE_IMAGE
install:
  method: docker_image
  # The author's own image, ghcr.io/bpx03/qengine:<release> (text only; the :vision tags add the vision encoder and
  # PyTorch, ~3 GB). Its org.opencontainers.image.revision label is the source commit: 1.3-rc4 is git tag v1.3-rc4.
  # pin-current: 1.3-rc4 · source 116bd8d9 · pinned 2026-10-27 · booted on both dual slugs (verify-full 9/9 each)
  spec: ghcr.io/bpx03/qengine@sha256:18b3c4bb43604fa3dcbff023710ec8e799725070f957cf667882319a544c0537
supported_model_families:
  - qwen35-dense          # Qwen3.8-27B, RedHatAI's INT4 only
  - qwen4exp              # Qwen3.8-Flash-Next via the SAME image's second engine (libqflash.so, chosen from the
                          # model dir's config.json model_type qwen4_exp*). Upstream calls it an experimental preview
                          # and tunes it for 3 GPUs; 2 is allowed by run.sh, untested there — the qengine/
                          # qwen38-flash-next-dual slug carries that as its caveat
supported_weight_formats:
  - compressed-tensors    # RedHatAI/Qwen3.8-27B-INT4 (pack-quantized W4A16, group 128, symmetric). It reads only
                          # weight_packed / weight_scale, so other INT4 formats (AutoRound's auto_gptq packing) don't load
  - qengine-int4          # bpx03/Qwen3.8-Flash-Next-QEngine: the QE-INT4 conversion (experts repacked bit-exact INT4,
                          # dense parts RTN INT4, INT8 n-gram table, MTP head + the three small routing/draft files).
                          # Loads in NO other engine — a format of its own, not compressed-tensors
supported_kv_formats:
  - fp8_e4m3              # its one K / V format: FP8 e4m3 in a shared pool per GPU
supported_drafters:
  - mtp                   # the checkpoint's MTP head, or the author's head fine-tuned on the engine's own answers
                          # (model_mtp_ft.safetensors, a release asset); it also drafts by lookup from the token history
notes: >
  QEngine (github.com/bpx03/QEngine, Krzysztof Jagus): ⚠️ PolyForm Noncommercial License 1.0.0, free
  for non-commercial use only; commercial use needs the author's licence. An independent C++/CUDA engine
  for one model on one kind of machine: Qwen3.8-27B INT4 (RedHatAI's compressed-tensors W4A16, plus its
  MTP head) on three RTX 3090s with tensor parallel 3 over PCIe, built for sm_86 only. The author has
  measured two cards (72-85% of the three-card throughput); one card is experimental (QE_MAX_SEQS 1-4).
  GPU-to-GPU P2P is used when the driver grants it, else a slower path through host memory. FP8 KV up
  to 262,144 tokens a conversation, MTP and lookup drafts, continuous batching up to 32 sequences,
  prefix and KV reuse with a host-RAM archive, structured output, tool calls, thinking on/off with
  reasoning-effort levels. Serves on 8080 (/v1/chat/completions, /v1/models with owned_by "qengine",
  /v1/messages, /health), with a dashboard and Prometheus metrics on 9393; settings are QE_* variables
  (QE_GPUS, QE_MAX_SEQS, QE_RESERVE_GB, QE_EXTRA_ARGS for server/app.py flags). From 1.3-rc4 a cross-turn
  loop guard is on by default: after 3 identical (reply, tool result) turns in a row, the next turn gets a
  presence penalty on the repeated reply and a server note appended to the latest tool result
  (QE_LOOP_GUARD_TURNS=0 turns it off, QE_LOOP_GUARD_NOTE=0 drops only the note, "loop_guard": false in a
  request turns it off for that request). Engine kind `qengine`.
  Slugs (2026-10-27): qengine/qwen38-27b-dual (TP=2, verify-full 9/9, canonical bench) and
  qengine/qwen38-flash-next-dual (TP=2, verify-full 9/9, clean en/ja/fr output on the 1.3-rc4 pin —
  the same artifact garbled on rc1/rc2). Both 🐣 Incubating; stress/soak/8-pack pending. The server's
  [stats] SpecDecoding lines are the vLLM-modern wording, so capture.sh's acceptance parser reads
  them unchanged; bench/health/verify-full find the container by its qengine- prefix.
