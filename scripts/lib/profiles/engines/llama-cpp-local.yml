schema_version: 1
id: llama-cpp-local
display_name: llama.cpp local CUDA server (MTP-enabled)
type: llama.cpp
# #1365: the compose env var this engine's image is injected as. The launchers
# export install.spec as LLAMACPP_IMAGE, so a pin bump here is what every
# llamacpp/* slug runs, whatever its compose default says.
#
# This was null until 2026-10-13, because the 15 ik-llama/* slugs also register
# against this profile and their composes read IK_LLAMA_IMAGE (ik_llama is a
# separate engine with no profile of its own, and it's out of the catalog). All
# 15 are deprecated now, and injecting LLAMACPP_IMAGE doesn't touch them: their
# composes never read it, so they keep running their own ik image.
#
# What changes: the 5 deprecated llamacpp/* composes that engine-pin-bump.sh
# skipped (they still default to the older ggml-org digest 6ac92152…) now run
# this pin when launched with --force, the same as deprecated vLLM composes do
# under VLLM_IMAGE. A SAVED LLAMACPP_IMAGE (club3090.env) is now ignored in
# favour of the pin, as for every other engine image; export it in the shell
# for a one-off build.
image_env: LLAMACPP_IMAGE

stability: stable
# The ik-llama slugs also register against this profile but run ikawrakow's own
# image (IK_LLAMA_IMAGE), so this lineage describes the mainline slugs only.
lineage:
  relation: "stock"
  base: "llama.cpp"
  base_version: "b11669"
  source: "https://github.com/ggml-org/llama.cpp"
  source_ref: "620d2225cc436ab0b001e3200e590e3b286ef9ab"
  chain: []
  delta: null
install:
  method: docker_image
  spec: ghcr.io/ggml-org/llama.cpp@sha256:e4cfff28678327b0ae7eda129e700e56a0fa55aa23db2f016256ea155c15c2b5
min_sm: 6.0
supported_model_families:
  - qwen3-next-hybrid
  - qwen3-next-moe
  - qwen35-dense          # Deckard-40B (standard GQA, arch=qwen35; MTP via embedded nextn head)
  - gemma4-unified
  - dense                 # plain transformer GGUFs (e.g. VibeThinker-3B, Qwen2 dense — no MTP)
  - deepseek4-moe         # DeepSeek-V4-Flash-0731 (arch deepseek4, 43 all-MoE layers, MLA+DSA) — CPU-offload slugs
features: {}
supported_kv_formats:
  - fp16                  # llama.cpp default when no -ctk/-ctv is passed (DeepSeek-Flash offload slugs)
  - q4_0
  - q5_0
  - q8_0
  - k8v4
supported_drafters:
  - mtp                   # embedded nextn head (self-spec) — 27B built-in, Deckard-40B
  - mtp_gguf              # external draft GGUF via --spec-draft-model — Tess-4-27B; live-validated on server-cuda-b9246 (dual 3090, 262K, 2026-07-09)
  - dspark                # DeepSeek-V4-Flash external DSpark drafter (--spec-type draft-dspark); runtime landed ggml-org#25784, present in b10236, ABSENT in b9967
supported_weight_formats:
  - gguf
required_overlays: []
vendored_overlays: []
required_genesis: false
notes: "Cliff-immune single-card fallback for Qwen GGUF serving. Uses upstream `ghcr.io/ggml-org/llama.cpp`, pinned BY DIGEST to `@sha256:e4cfff28...` = release **v0.7.0** = build b11669 (commit `620d2225c`, image `server-cuda-b11669` = `server-cuda12-b11669`, built 2026-10-15T19:04Z, CUDA 12.8.1 — the same base as v0.6.0; read it back from the index annotations or `llama-server --version`, which prints `0.7.0-dev (build 11669, commit 620d2225c)`). ⚠️ HOW TO FIND A RELEASE IMAGE (2026-10-06, still true for v0.7.0 on 2026-10-17): upstream published NO `server-cuda-v0.6.0` / `server-cuda-v0.7.0` alias (404), unlike v0.5.0. Per-build tags are back instead: map the release tag to its commit, the commit to its `bNNNNN` tag (`git ls-remote --tags https://github.com/ggml-org/llama.cpp | grep <commit>`), then use `server-cuda-bNNNNN` and pin its digest. Validated 2026-10-17 (boot tests only, 370 / 420 W stock): qwen38-27b-single-iq4xs, qwen38-27b-dual-q8kxl and mimo9b-single-vision boot via switch.sh on this digest, serve a request and keep 0 restarts; every flag in the 10 functional composes is still in b11669's `--help` (nothing was removed since b11429; v0.7.0's new default port 9931 doesn't apply, since every compose passes `--port`). NOT booted: tess-dual-mtp, deckard40B-dual-mtp and the DeepSeek / gemma-12b / 35B-A3B slugs (weights not on the rig). The v0.6.0 validation (2026-10-06, 230 W) had the three booted slugs through verify-full and tess-dual-mtp booted. The digest pin stays — a tag can be re-pushed, a digest cannot. WHY A DIGEST AND NOT `server-cuda-bNNNN` (history: per-build tags were back by b11429): upstream STOPPED publishing per-build CUDA server images in 2026-09. Probed 2026-09-12 -- the old `server-cuda-b10236` returns 200, but b10930 / b10917 / b10901 / b10883 / b10867 / b10850 / b10793 all 404, as do `server-cuda12-b10917`, `full-cuda-b10917`, `light-cuda-b10917`, `cuda-b10917` and bare `b10917`; only the ROLLING tags (`server-cuda`, `server-cuda12`, `server`, `full-cuda`) still resolve. So 'always pin a validated build' is no longer satisfiable via a build tag. Pinning the rolling tag's DIGEST keeps both properties: immutable (a digest cannot move under us, which is exactly the #187 hazard) AND validated (the labels still name the build). Already the house pattern -- beellama-local and all three llamacpp-club3090 profiles pin `@sha256:`. To bump: resolve the rolling tag via `docker buildx imagetools inspect ... --format {{.Manifest.Digest}}`, validate, then pin that digest. Pin history: b9246 → b9967 2026-07-11 after a full quality A/B on Tess dual (think-OFF total tie 115=115, think-ON 122 vs the 118x3 pin — the lift is thinking-path-specific); b9967 → b10236 2026-08-06, chosen because it is the build the DeepSeek-V4-Flash offload matrix was measured on and it carries **DSpark** (worth +26–56% decode on that model), which b9967 lacks. b10236 → b10920 2026-09-12 (digest pin, see below); b10920 → v0.5.0/b11146 2026-09-23 (carries `bfd73a876`/ggml-org#29257 — the Qwen3-Coder handler fix that lets MiMo's vendored template patch drop — and #28549 CUDA graphs for MTP drafting; unbooted at pin time). v0.5.0/b11146 → v0.6.0/b11429 2026-10-06 (MiMo's template patch dropped in the same change: CLI-21…26 6/6 without it). v0.6.0/b11429 → v0.7.0/b11669 2026-10-17 (rewrites the server's chat layer, #30210 / #30389 / #29876, which tool-call and reasoning parsing go through; adds mainline's own host-memory MoE expert cache, `--moe-cache-mib`, #29887 / #30112). The b10236 pick was deliberately NOT the newest build at bump time (b10297) — shipping an unmeasured image is the failure this pin exists to prevent. ⚠️⚠️ THAT RULE NEARLY PRODUCED A FALSE REGRESSION REPORT on the 2026-09-12 bump, and the lesson is about POWER, not builds. b10920 first benched 36.7 narr / 42.4 code against the recorded b10236 baseline of 61.55 / 71.33 -- a -40% that looked exactly like an upstream spec-decode regression, with the drafter accepting healthily (0.83-0.89) but converting nothing. The cause was `nvidia-power-cap.service`, an ENABLED systemd unit (description: cap both RTX 3090s at 230W for quieter/cooler operation) running `nvidia-smi -pl 230` on both cards at every boot, against a 370 W default. Uncapped, the SAME image measures 67.2 narr / 78.8 code -- +9%/+10% OVER the baseline. Two standing consequences: (1) a depth arm alone would NOT have caught it, since SPEC_N=1 and SPEC_N=2 measured identically -- that is what ruled out the depth hypothesis and pointed at the machine; (2) the recorded b10236 baseline carries NO power annotation and so is not reproducible from its own entry, while neighbouring BENCHMARKS rows do annotate power. ⇒ Capture `power.limit` vs `power.default_limit` before quoting ANY llama.cpp number on this rig. NOT the rolling `:server-cuda` tag either — it regressed at b9282 with a broken-lib crash loop, #187; always pin validated builds. MTP PR #22673 merged upstream + draft-eagle3 + draft-mtp spec types available natively. Bump via env once a newer build is validated: `LLAMACPP_IMAGE=ghcr.io/.../server-cuda-bXXXX`. No club-3090 patches on llama.cpp; we follow upstream as-is (`vendored_overlays: []`)."

