# ===========================================================================
# Profile (at-a-glance):
#   Model:     Qwen3.8-27B (RedHatAI compressed-tensors W4A16 INT4 + MTP head,
#              plus bpx03's model_mtp_ft.safetensors draft fine-tune when present)
#   Engine:    QEngine 1.3 (ghcr.io/bpx03/qengine, pinned by digest; libqengine.so)
#   Topology:  Dual 3090 PCIe (TP=2, QE_GPUS 0,1). P2P used when the host driver grants
#              it (check the `P2P:` line in the startup log), else the host-memory path.
#   Drafter:   MTP (the checkpoint's head, or the _ft copy; adaptive, max k=7) + lookup drafts
#   KV:        fp8_e4m3 (the engine's only format), 32 GB host-RAM archive (QE_KV_ARCHIVE_GB)
#   Vision:    no (text-only image; --vision needs the :vision tag)
#   Max ctx:   262144
#   Genesis:   N/A — Genesis is Qwen3-Next-specific
#   Status:    🐣 Incubating
#   Caveats:   Not gate-passing yet: verify-full 9/9 PASS + canonical bench on the
#              1.3-rc4 image (2026-10-27); the pin now sits on 1.3, so re-boot and re-run
#              verify-full before trusting those numbers. stress / soak / 8-pack pending.
#              Upstream tunes this engine for 3× 3090; 2 cards is measured by the author
#              (72-85% of TP=3) but not the shipped default. PolyForm Noncommercial
#              licence on the engine. Thinking is ON by default (--think 1); toggle per
#              launch with ENABLE_THINKING=false (and the draft depth with SPEC_N=0..7)
#              — the compose entrypoint maps them onto --think / --mtp-k; QE_EXTRA_ARGS
#              still passes verbatim and wins when it names the same flag. No
#              server-side reasoning_effort default exists (per-request only; the
#              template's own default is xhigh), so REASONING_EFFORT / THINKING_BUDGETS
#              are unsupported (docs/engines/QENGINE.md). Its server sampler (0.6 /
#              0.95 / 20 / 0.0) already IS the canonical club sampler; the template is
#              the image's own qwen38_syssafe.jinja (chat_template: native).
#   Best for:  INT4 dual-card serving of Qwen3.8-27B (upstream: 1.2-2.0x vLLM output TPS)
# ---------------------------------------------------------------------------
# QEngine (github.com/bpx03/QEngine) is an independent C++/CUDA engine for this one
# model; the engine profile scripts/lib/profiles/engines/qengine.yml carries the details.
# The image ships both engine libraries; the server picks libqengine.so from this
# model dir's config.json (model_type qwen3_5). The qengine-cache mount keeps the
# GEMM tune table + KV split warm between restarts (without it every start re-tunes).
services:
  qengine:
    image: ${QENGINE_IMAGE:-ghcr.io/bpx03/qengine@sha256:b9d1b0afe8f96547b3a05de73aff437077effcb1117c82ab2e0fe62bf000b3da}
    container_name: ${ESTATE_CONTAINER:-qengine-qwen38-27b-dual}
    restart: ${CLUB3090_RESTART:-unless-stopped}
    user: "0:${DOCKER_GID:-1000}"
    ipc: host               # upstream: --ipc=host (pinned host-memory KV archive)
    ulimits:
      memlock: -1           # upstream: --ulimit memlock=-1
    stop_grace_period: 60s  # the server saves live conversations to the disk cache on SIGTERM
    ports:
      - "${BIND_HOST:-0.0.0.0}:${ESTATE_PORT:-${PORT:-8089}}:8080"
      # dashboard + /metrics, host-local by default (upstream binds 127.0.0.1)
      - "${QE_METRICS_BIND_HOST:-127.0.0.1}:${QE_METRICS_PORT_HOST:-9394}:9393"
    # club-3090 standard knobs -> QEngine flags (the image entrypoint appends the
    # command line to server/app.py). QE_EXTRA_ARGS naming the same flag wins.
    entrypoint:
      - /bin/bash
      - -c
      - |
        umask 0002          # cache files stay group-writable for the host user
        _knob=()
        if [ "$${ENABLE_THINKING:-}" != "" ]; then
          case "$${ENABLE_THINKING}" in true|false) ;;
            *) echo "[qengine] ENABLE_THINKING='$${ENABLE_THINKING}' must be true or false." >&2; exit 2 ;;
          esac
          case " $${QE_EXTRA_ARGS:-} " in *" --think "*) ;;
            *) if [ "$${ENABLE_THINKING}" = true ]; then _knob+=(--think 1); else _knob+=(--think 0); fi ;;
          esac
        fi
        if [ "$${SPEC_N:-}" != "" ]; then
          case "$${SPEC_N}" in
            ''|*[!0-9]*) echo "[qengine] SPEC_N='$${SPEC_N}' must be an integer 0..$${QE_MTP_K_MAX:-7}." >&2; exit 2 ;;
            *) if [ "$${SPEC_N}" -gt "$${QE_MTP_K_MAX:-7}" ]; then echo "[qengine] SPEC_N='$${SPEC_N}' must be an integer 0..$${QE_MTP_K_MAX:-7}." >&2; exit 2; fi ;;
          esac
          case " $${QE_EXTRA_ARGS:-} " in *" --mtp-k "*) ;;
            *) _knob+=(--mtp-k "$${SPEC_N}") ;;
          esac
        fi
        exec /usr/local/bin/qengine-entrypoint "$${_knob[@]}" "$@"
    environment:
      QE_GPUS: "${QE_GPUS:-0,1}"
      QE_MODEL: /app/models/Qwen3.8-27B-INT4
      QE_MAX_SEQS: "${QE_MAX_SEQS:-32}"        # upstream's 2x3090 line: 32 slots, full 262K
      QE_RESERVE_GB: "${QE_RESERVE_GB:-1.5}"
      QE_KV_ARCHIVE_GB: "${QE_KV_ARCHIVE_GB:-32}"
      # club-3090 standard knobs, read by the entrypoint below. Null value on
      # purpose: the host value passes through when set and the variable is
      # ABSENT when unset — `- VAR=${VAR:-}` would set it EMPTY-but-present,
      # which the ratchet forbids for catalogued knobs.
      ENABLE_THINKING:
      SPEC_N:
      # verbatim passthrough to server/app.py: --think 0, --mtp-k N, ...
      QE_EXTRA_ARGS: "${QE_EXTRA_ARGS:---max-ctx ${MAX_MODEL_LEN:-262144}}"
    volumes:
      - "${MODEL_DIR:-../../../../../../models-cache}/Qwen3.8-27B-INT4:/app/models/Qwen3.8-27B-INT4:ro"
      - "${CLUB3090_ENGINE_CACHE_DIR:-../../../cache}/qengine:/root/.cache/qengine"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${ESTATE_GPUS:-${CUDA_VISIBLE_DEVICES:-0,1}}']
              capabilities: [gpu]
