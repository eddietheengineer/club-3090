name: Project Maya image

# Builds ghcr.io/noonghunna/strata-maya-club3090 for each new Project Maya release, with the
# recipe in models/glm-5.3-flash/strata-maya/image/ (README there). Maya releases several times a
# day, so this runs every day and builds the newest release unless it is already published.
# Publishing is not a pin bump: the strata-maya engine profile moves to a new digest only after a
# rig boot and verify-full.

on:
  schedule:
    - cron: '10 7 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Project Maya release tag (vX.Y.Z); empty builds the newest'
        required: false
        default: ''
      force:
        description: 'Rebuild and re-push a tag that is already published'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write        # push to ghcr.io/noonghunna/strata-maya-club3090
  id-token: write        # sign the provenance attestation
  attestations: write

concurrency:
  group: strata-maya-image
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'noonghunna/club-3090'
    runs-on: ubuntu-24.04
    # A 4-vCPU, 15 GB runner; build.sh --jobs 4 uses all four, as the Strata image's build does
    # (79 min there). 6 h is the cap.
    timeout-minutes: 340
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The build stage is a CUDA 13 devel image plus the engine's objects; the runner's free space is not.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/share/swift
          docker image prune -af >/dev/null
          df -h /
          avail=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          if [ "$avail" -lt 30 ]; then
            echo "::error::only ${avail} GB free on /; the build needs about 30 GB"
            exit 1
          fi

      # Recorded, not acted on: STRATA_PORTABLE=ON makes the image's CPU code independent of this machine.
      - name: Record the runner
        run: |
          model=$(lscpu | sed -n 's/^Model name: *//p' | head -1)
          avx512=$(grep -qw avx512f /proc/cpuinfo && echo yes || echo no)
          echo "Runner CPU: $model (AVX-512: $avx512), $(nproc) threads, $(free -g | awk '/^Mem:/ {print $2}') GB RAM" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, check and push
        id: build
        env:
          TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          args=(--push --jobs 4)
          if [ -n "$TAG" ]; then args+=(--tag "$TAG"); fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          bash models/glm-5.3-flash/strata-maya/image/build.sh "${args[@]}"

      - name: Attest build provenance
        if: steps.build.outputs.digest != ''
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/noonghunna/strata-maya-club3090
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
