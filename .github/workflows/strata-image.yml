name: Strata image

# Builds ghcr.io/noonghunna/strata-club3090 for each new Strata release, with the recipe in
# models/qwen3.8-flash-next/strata/image/ (README there). Strata releases about daily, so this
# runs every day and builds the newest release unless it is already published. Publishing is
# not a pin bump: the strata engine profile moves to a new digest only after a rig boot and
# verify-full.

on:
  schedule:
    - cron: '40 5 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Strata release tag (vX.Y.Z[.N]); empty builds the newest'
        required: false
        default: ''
      force:
        description: 'Rebuild and re-push a tag that is already published'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write        # push to ghcr.io/noonghunna/strata-club3090
  id-token: write        # sign the provenance attestation
  attestations: write

concurrency:
  group: strata-image
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'noonghunna/club-3090'
    runs-on: ubuntu-24.04
    # A 4-vCPU, 15 GB runner. setup.py would compile with 2 jobs (cpu_count // 2); build.sh
    # --jobs 4 uses all four. Measured on v0.1.43.1, 2026-10-13: compile 5,435 s -> 4,516 s, run
    # 95 -> 79 min, no out-of-memory. 6 h is the cap.
    timeout-minutes: 340
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The image is ~15 GB (CUDA 13 devel base + the engine); the runner's free space is not.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/share/swift
          docker image prune -af >/dev/null
          df -h /
          avail=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          if [ "$avail" -lt 30 ]; then
            echo "::error::only ${avail} GB free on /; the build needs about 30 GB"
            exit 1
          fi

      # Recorded, not acted on: portable.py makes the image's CPU code independent of this machine.
      - name: Record the runner
        run: |
          model=$(lscpu | sed -n 's/^Model name: *//p' | head -1)
          avx512=$(grep -qw avx512f /proc/cpuinfo && echo yes || echo no)
          echo "Runner CPU: $model (AVX-512: $avx512), $(nproc) threads, $(free -g | awk '/^Mem:/ {print $2}') GB RAM" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, check and push
        id: build
        env:
          TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          args=(--push --jobs 4)
          if [ -n "$TAG" ]; then args+=(--tag "$TAG"); fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          bash models/qwen3.8-flash-next/strata/image/build.sh "${args[@]}"

      - name: Attest build provenance
        if: steps.build.outputs.digest != ''
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/noonghunna/strata-club3090
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
